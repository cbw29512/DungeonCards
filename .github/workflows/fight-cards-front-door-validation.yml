name: Fight Cards Front Door Validation

on:
  push:
    branches:
      - agent/fight-cards-front-door

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Front door contract
        run: npx vitest run src/App.test.tsx src/components/DndFightCardsArena.test.tsx
      - name: Combat regressions
        run: npx vitest run src/utils/fightRules.test.ts src/utils/fightBattle.test.ts src/utils/fightBattleRules.test.ts
      - name: Full suite
        run: npm test
      - name: Production build
        run: npm run build
