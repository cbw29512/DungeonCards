name: RAW Pregen Monster Certification

on:
  push:
    branches:
      - agent/raw-pregen-monster-certification

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-certification-test-output
          path: test-output.log
          if-no-files-found: error
          retention-days: 7
      - run: npm run build
