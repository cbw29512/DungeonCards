name: P0 Dependency Audit Diagnosis

on:
  push:
    branches:
      - agent/p0-dependency-audit-diagnosis

permissions:
  contents: read

jobs:
  prove-minimal-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture nanoid dependency chain
        run: npm ls nanoid --all --json > npm-ls-nanoid.json || true

      - name: Capture baseline audit
        run: npm audit --json > npm-audit-before.json || true

      - name: Apply lockfile-only audit fix
        run: |
          cp package-lock.json package-lock.before.json
          npm audit fix --package-lock-only
          git diff -- package-lock.json > package-lock.diff

      - name: Require clean high-severity audit
        run: npm audit --audit-level=high

      - name: Reinstall from repaired lockfile
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload diagnostic and repaired lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-fix-proof
          path: |
            npm-ls-nanoid.json
            npm-audit-before.json
            package-lock.diff
            package-lock.json
