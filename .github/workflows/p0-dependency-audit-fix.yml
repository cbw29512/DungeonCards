name: P0 Dependency Audit Fix

on:
  push:
    branches:
      - agent/p0-dependency-audit-fix

permissions:
  contents: write

jobs:
  apply-verified-lock-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-dependency-audit-fix

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply lockfile-only audit fix
        run: npm audit fix --package-lock-only

      - name: Verify only the lockfile changed
        run: |
          test -z "$(git diff --name-only -- . ':!package-lock.json')"
          test -n "$(git diff --name-only -- package-lock.json)"

      - name: Require clean high-severity audit
        run: npm audit --audit-level=high

      - name: Reinstall from repaired lockfile
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit verified lockfile repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fix transitive nanoid audit vulnerability"
          git push origin HEAD:agent/p0-dependency-audit-fix
