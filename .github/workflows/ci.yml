name: Dungeon Cards CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "agent/**"
  pull_request:
    branches:
      - main
      - "feature/**"

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair vulnerable lock entries
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already contains the available security fixes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update vulnerable transitive dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.log

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.log

  generate-srd-catalogs:
    if: github.head_ref == 'agent/full-srd-catalog-foundation' || github.ref_name == 'agent/full-srd-catalog-foundation'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install PDF extraction utility
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Generate catalogs from official PDFs
        run: |
          set -o pipefail
          npm run sync:srd 2>&1 | tee srd-sync.log

      - name: Upload generated catalogs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-srd-catalogs
          if-no-files-found: warn
          path: |
            src/generated/srd-spells.json
            src/generated/srd-monsters.json
            src/generated/srd-manifest.json
            /tmp/dungeon-cards-srd-sync/spells-*.txt
            /tmp/dungeon-cards-srd-sync/monsters-*.txt
            srd-sync.log
