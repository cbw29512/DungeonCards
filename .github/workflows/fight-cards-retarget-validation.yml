name: Fight Cards Retarget Validation

on:
  push:
    branches:
      - agent/fight-cards-midturn-retarget

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Retarget contract
        run: npx vitest run src/utils/fightBattle.test.ts src/utils/fightPartySimulation.test.ts src/utils/fightBattleEffects.test.ts
      - name: Full suite
        run: npm test
      - name: Production build
        run: npm run build
