name: Indomitable Integration Validation

on:
  push:
    branches:
      - agent/fighter-2024-indomitable

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fighter-2024-indomitable
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact Indomitable integration
        run: python .github/scripts/apply_fighter_2024_indomitable.py
      - name: Focused Indomitable contracts
        run: npx vitest run src/utils/fightSavingThrow.test.ts src/utils/fighter2024Indomitable.test.ts src/utils/fighter2024IndomitableIntegration.test.ts src/utils/fightBattleEffects.test.ts src/utils/fightBattle.test.ts src/utils/fightProfileAdapters.test.ts
      - name: Full repository suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified integration
        run: |
          rm .github/workflows/fighter-2024-indomitable-integration.yml
          rm .github/scripts/apply_fighter_2024_indomitable.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/fightBattle.ts src/utils/fightProfileAdapters.ts .github/workflows/fighter-2024-indomitable-integration.yml .github/scripts/apply_fighter_2024_indomitable.py
          git commit -m "feat: integrate 5.5e Indomitable saving throws"
          git push origin HEAD:agent/fighter-2024-indomitable
