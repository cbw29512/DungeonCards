name: Fight Cards Positioning Validation

on:
  push:
    branches:
      - agent/fight-cards-party-positioning

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Positioning contracts
        run: npx vitest run src/utils/fightEncounterSetup.test.ts src/utils/fightBattle.test.ts src/utils/fightSimulation.test.ts src/utils/fightPartySimulation.test.ts
      - name: Full suite
        run: npm test
      - name: Production build
        run: npm run build
