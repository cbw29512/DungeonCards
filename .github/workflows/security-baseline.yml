name: Security Baseline

on:
  push:
    branches:
      - main
      - "feature/**"
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan tracked files and Git history
        shell: bash
        run: |
          set -euo pipefail
          credential_pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|(AKIA|ASIA)[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,255}|github_pat_[A-Za-z0-9_]{50,255}|xox[baprs]-[A-Za-z0-9-]{20,}|sk-(proj-|ant-)?[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|sb_secret_[A-Za-z0-9_-]{16,}'
          browser_secret_pattern='VITE_[A-Z0-9_]*(SERVICE_ROLE|SECRET)'
          combined_pattern="${credential_pattern}|${browser_secret_pattern}"
          found=0

          files="$(git grep -I -l -E "$combined_pattern" HEAD -- . || true)"
          names="$(git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|credentials\.json|service-account\.json)$|\.(pem|p12|pfx)$' | grep -v -E '\.env\.example$|\.example\.(pem|key)$' || true)"

          if [[ -n "$files" ]]; then
            echo "Potential credential patterns were found in tracked files:"
            printf '%s\n' "$files"
            found=1
          fi

          if [[ -n "$names" ]]; then
            echo "Sensitive filenames are tracked:"
            printf '%s\n' "$names"
            found=1
          fi

          if git log -p --all --no-ext-diff --no-renames --pretty=format: | grep -E -q "$combined_pattern"; then
            echo "A potential credential pattern exists in Git history."
            found=1
          fi

          if [[ "$found" -ne 0 ]]; then
            echo "Rotate any real credential before performing history cleanup."
            exit 1
          fi
