name: Apply 5.5e Fighter Core Combat Patch

on:
  push:
    branches:
      - agent/fighter-2024-core-combat

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fighter-2024-core-combat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply narrow Fighter 2024 engine changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          # Profile metadata: initiative roll mode.
          replace_once(
              'src/types/fightMatchmaker.ts',
              'import type { FightActionDefinition, FightResourceDefinition } from "./fightRules";',
              'import type { FightActionDefinition, FightResourceDefinition, FightRollMode } from "./fightRules";',
              'fightMatchmaker import'
          )
          replace_once(
              'src/types/fightMatchmaker.ts',
              '  initiativeBonus?: number;\n',
              '  initiativeBonus?: number;\n  initiativeRollMode?: FightRollMode;\n',
              'initiativeRollMode field'
          )

          # Action/resource metadata.
          replace_once(
              'src/types/fightRules.ts',
              '  refresh: "turn" | "round" | "short-rest" | "long-rest" | "manual" | "none";\n};',
              '  refresh: "turn" | "round" | "short-rest" | "long-rest" | "manual" | "none";\n  shortRestRecovery?: number | "all";\n  longRestRecovery?: number | "all";\n};',
              'resource recovery metadata'
          )
          replace_once(
              'src/types/fightRules.ts',
              'export type FightHealAction = FightActionBase & {\n  kind: "heal";\n  formula: string;\n  target: "self";\n};',
              'export type FightHealAction = FightActionBase & {\n  kind: "heal";\n  formula: string;\n  target: "self";\n  movementGrantedFeet?: number;\n};',
              'heal movement metadata'
          )
          replace_once(
              'src/types/fightRules.ts',
              'export type FightGrantAction = FightActionBase & {\n  kind: "grant-action";\n  grants: "action";\n};',
              'export type FightGrantAction = FightActionBase & {\n  kind: "grant-action";\n  grants: "action";\n  excludedDelivery?: FightActionDelivery;\n};',
              'grant action restriction'
          )

          # Turn economy remembers a restriction only for the granted action.
          replace_once(
              'src/types/fightBattle.ts',
              '  movementRemainingFeet: number;\n};',
              '  movementRemainingFeet: number;\n  restrictedActionDelivery?: "weapon" | "spell";\n};',
              'restricted action economy'
          )

          battle = Path('src/utils/fightBattle.ts')
          text = battle.read_text()
          replacements = [
              (
                  '  const characterRoll = rollDiceFormula(attackFormula(state.character.profile.initiativeBonus ?? 0), { randomInteger });\n  const monsterRoll = rollDiceFormula(attackFormula(state.monster.profile.initiativeBonus ?? 0), { randomInteger });',
                  '  const characterRoll = rollDiceFormula(attackFormula(state.character.profile.initiativeBonus ?? 0), {\n    advantageMode: state.character.profile.initiativeRollMode,\n    randomInteger\n  });\n  const monsterRoll = rollDiceFormula(attackFormula(state.monster.profile.initiativeBonus ?? 0), {\n    advantageMode: state.monster.profile.initiativeRollMode,\n    randomInteger\n  });'
              ),
              (
                  'const canUseAction = (state: FightBattleState, side: FightSide, action: FightActionDefinition): boolean =>\n  !isFightIncapacitated(state[side])\n  && hasEconomy(state, side, action)\n  && hasResourceCosts(state, side, action)\n  && (!action.recharge || state[side].rechargeReady[action.id] !== false);',
                  'const canUseAction = (state: FightBattleState, side: FightSide, action: FightActionDefinition): boolean =>\n  !isFightIncapacitated(state[side])\n  && hasEconomy(state, side, action)\n  && !(action.economy === "action"\n    && state[side].economy.restrictedActionDelivery\n    && action.delivery === state[side].economy.restrictedActionDelivery)\n  && hasResourceCosts(state, side, action)\n  && (!action.recharge || state[side].rechargeReady[action.id] !== false);'
              ),
              (
                  '    if (action.economy === "action") economy.actionsAvailable = Math.max(0, economy.actionsAvailable - 1);',
                  '    if (action.economy === "action") {\n      economy.actionsAvailable = Math.max(0, economy.actionsAvailable - 1);\n      if (economy.restrictedActionDelivery) economy.restrictedActionDelivery = undefined;\n    }'
              ),
              (
                  '  if (action.kind === "heal") {\n    const amount = Math.max(0, rollDiceFormula(action.formula, { randomInteger }).total);\n    return healFightCombatant(next, attacker, amount, action.name);\n  }',
                  '  if (action.kind === "heal") {\n    const amount = Math.max(0, rollDiceFormula(action.formula, { randomInteger }).total);\n    let healed = healFightCombatant(next, attacker, amount, action.name);\n    const movementGrantedFeet = Math.max(0, action.movementGrantedFeet ?? 0);\n    if (movementGrantedFeet > 0) {\n      healed = {\n        ...healed,\n        [attacker]: {\n          ...healed[attacker],\n          economy: {\n            ...healed[attacker].economy,\n            movementRemainingFeet: healed[attacker].economy.movementRemainingFeet + movementGrantedFeet\n          }\n        }\n      };\n      healed = appendFightPresentationEvent(healed, {\n        type: "movement",\n        delivery: "system",\n        side: attacker,\n        sourceSide: attacker,\n        label: `${action.name}: ${movementGrantedFeet} ft movement available`,\n        sourceName: action.name,\n        amount: movementGrantedFeet,\n        iconKey: "movement"\n      });\n    }\n    return healed;\n  }'
              ),
              (
                  '        economy: { ...next[attacker].economy, actionsAvailable: next[attacker].economy.actionsAvailable + 1 }',
                  '        economy: {\n          ...next[attacker].economy,\n          actionsAvailable: next[attacker].economy.actionsAvailable + 1,\n          restrictedActionDelivery: action.excludedDelivery\n        }'
              )
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'fightBattle patch expected 1 match, got {text.count(old)} for: {old[:80]}')
              text = text.replace(old, new, 1)
          battle.write_text(text)

          adapters = Path('src/utils/fightProfileAdapters.ts')
          text = adapters.read_text()
          pattern = re.compile(
              r'  const resources: NonNullable<FightCombatantProfile\["resources"\]> = \[\];\s*'
              r'if \(character\.ruleset === "srd-5\.1-2014" && character\.classId === "fighter"\) \{.*?\n  \}\n  const spells = characterSpellActions\(character\);',
              re.S
          )
          replacement = '''  const resources: NonNullable<FightCombatantProfile["resources"]> = [];
  const supportedFighter = character.classId === "fighter"
    && (character.ruleset === "srd-5.1-2014" || character.ruleset === "srd-5.2.1-2024");
  if (supportedFighter) {
    const secondWindMaximum = character.ruleset === "srd-5.2.1-2024"
      ? character.level >= 10 ? 4 : character.level >= 4 ? 3 : 2
      : 1;
    resources.push({
      id: "second-wind",
      name: "Second Wind",
      maximum: secondWindMaximum,
      refresh: "short-rest",
      shortRestRecovery: character.ruleset === "srd-5.2.1-2024" ? 1 : "all",
      longRestRecovery: "all"
    });
    actions.push({
      id: "second-wind",
      name: "Second Wind",
      kind: "heal",
      economy: "bonus-action",
      target: "self",
      formula: `1d10+${character.level}`,
      ...(character.ruleset === "srd-5.2.1-2024" && character.level >= 5
        ? { movementGrantedFeet: Math.floor(character.speedFeet / 2) }
        : {}),
      resourceCosts: [{ resourceId: "second-wind", amount: 1 }]
    });
    if (character.level >= 2) {
      resources.push({
        id: "action-surge",
        name: "Action Surge",
        maximum: character.level >= 17 ? 2 : 1,
        refresh: "short-rest",
        shortRestRecovery: "all",
        longRestRecovery: "all"
      });
      actions.push({
        id: "action-surge",
        name: "Action Surge",
        kind: "grant-action",
        economy: "free",
        grants: "action",
        ...(character.ruleset === "srd-5.2.1-2024" ? { excludedDelivery: "spell" as const } : {}),
        resourceCosts: [{ resourceId: "action-surge", amount: 1 }]
      });
    }
  }
  const spells = characterSpellActions(character);'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Fighter resource block expected 1 match, got {count}')
          old = '      initiativeBonus: abilityModifier(character.abilityScores.dex),\n'
          new = '      initiativeBonus: abilityModifier(character.abilityScores.dex),\n      initiativeRollMode: character.ruleset === "srd-5.2.1-2024" && isSupportedChampion && character.level >= 3 ? "advantage" : undefined,\n'
          if text.count(old) != 1:
              raise SystemExit(f'initiative profile field expected 1 match, got {text.count(old)}')
          adapters.write_text(text.replace(old, new, 1))
          PY
      - name: Focused Fighter 2024 contracts
        run: npx vitest run src/utils/fighter2024CoreCombat.test.ts src/utils/championCriticalThresholds.test.ts src/utils/fightBattle.test.ts src/utils/fightProfileAdapters.test.ts
      - name: Full repository suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified patch and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/fighter-2024-core-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/fightMatchmaker.ts src/types/fightRules.ts src/types/fightBattle.ts src/utils/fightBattle.ts src/utils/fightProfileAdapters.ts .github/workflows/fighter-2024-core-patch.yml
          git commit -m "feat: model 5.5e Fighter core combat resources"
          git push origin HEAD:agent/fighter-2024-core-combat
